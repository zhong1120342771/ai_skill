# 用户可见开放事项编号与引用格式契约。
# 兼容说明：文件名暂保留 blocker_contract.yaml，避免旧脚本和引用断裂；
# v0.7.4 起用户可见语义已调整为 open items / R-x，内部结构计划仍可兼容 6-Rx。
# 注意：以下 key 和正则表达式供脚本读取，不要翻译 key。
open_item_id_pattern: "^R-[0-9]+$"
open_item_ref_pattern: "\\bR-[0-9]+\\b"

forbidden_public_state_variants:
  - "\\[假设\\]"
  - "\\[阻塞\\]"
  - "\\b6-R[0-9]+\\b"
  - "\\[阻塞-[0-9]+\\]"
  - "\\[R[0-9]+\\]"
  - "\\[阻塞项[0-9]+\\]"
  - "依赖 \\[阻塞-[0-9]+\\]"
  - "待 \\[阻塞-[0-9]+\\] 解锁"

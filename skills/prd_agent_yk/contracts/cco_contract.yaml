# 核心改动对象 CCO 的固定字段契约。
# 注意：以下 key 供脚本读取，不要翻译 key。
cco_heading_pattern: "^### 核心改动对象"

required_cco_fields:
  - "对象信息"
  - "当前逻辑"
  - "目标行为"
  - "触发条件与前置条件"
  - "主流程"
  - "业务规则"
  - "异常与边界"
  - "页面 / 原型"
  - "数据需求 / 系统能力 / 权限 / 埋点目标"
  - "验收标准"
  - "测试建议"

forbidden_replacement_fields:
  - "Context"
  - "Change"
  - "Outcome"
  - "处理规则"
  - "记录要求"
